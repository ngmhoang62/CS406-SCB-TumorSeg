# ==============================================================================
# SCB-TumorSeg: Master Configuration (Steps 1 -> 8)
# ==============================================================================

project:
  name: "SCB-TumorSeg"
  seed: 42
  num_workers: 4

paths:
  raw_dir: "data_real/raw"
  raw_images_dir: "data_real/raw/images"
  raw_expert_seg_dir: "data_real/raw/segmentations/expert"
  raw_auto_seg_dir: "data_real/raw/segmentations/automatic"
  clinical_excel: "data_real/raw/clinical_and_imaging_info.xlsx"
  official_splits_csv: "data_real/raw/train_test_splits.csv"
  processed_npz_dir: "data_real/processed/npz_96x96x96"
  splits_dir: "data_real/splits"
  splits_metadata_csv: "data_real/splits/splits_metadata.csv"
  outputs_dir: "outputs"
  checkpoints_dir: "outputs/checkpoints"
  logs_dir: "outputs/logs"
  predictions_dir: "outputs/predictions"
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"

# ------------------------------------------------------------------------------
# STEP 1: Data Ingestion, Filtering & Stratified Splitting
# ------------------------------------------------------------------------------
step1_ingestion:
  val_ratio: 0.15
  phases: [0, 1]  # _0000 (Pre-contrast) and _0001 (First Post-contrast)
  subtype_classes:
    0: "Luminal"
    1: "Triple Negative"
    2: "HER2-enriched"
    3: "HER2-pure"
  raw_to_canonical_subtype:
    luminal: "Luminal"
    luminal_a: "Luminal"
    luminal_b: "Luminal"
    Luminal: "Luminal"
    triple_negative: "Triple Negative"
    "Triple Negative": "Triple Negative"
    her2_enriched: "HER2-enriched"
    "HER2-enriched": "HER2-enriched"
    her2_pure: "HER2-pure"
    "HER2-pure": "HER2-pure"

# ------------------------------------------------------------------------------
# STEP 2: Spatial Standardization & High-Res 3D VOI Extraction (96x96x96)
# ------------------------------------------------------------------------------
step2_spatial_voi:
  target_orientation: "RAS"
  target_spacing: [1.0, 1.0, 1.0]  # mm^3 isotropic
  voi_size: [96, 96, 96]           # (D, H, W) voxels
  voi_margin_ratio: 0.25           # 25% spatial margin around tumor bounding box
  pad_mode: "constant"             # "constant" (zero padding) or "reflect"

# ------------------------------------------------------------------------------
# STEP 3: Multi-Representation Image Processing Pipeline
# ------------------------------------------------------------------------------
step3_image_processing:
  apply_n4_bias_correction: false  # Optional (CPU intensive); set true if needed
  n4_shrink_factor: 2
  apply_edge_preserving_denoise: true
  denoise_method: "nlmeans"        # "nlmeans" (Non-Local Means) or "curvature_flow"
  nlmeans_patch_size: 3
  nlmeans_patch_distance: 5
  nlmeans_h_factor: 0.8
  clip_percentiles: [0.5, 99.5]
  pe_tau_percentile: 5.0           # Stabilizer tau in I_PE = max(0, I_post1 - I_pre) / (I_pre + tau)
  clahe_clip_limit: 0.03
  clahe_kernel_size: 16
  zscore_eps: 1.0e-8
  output_dtype: "float16"

# ------------------------------------------------------------------------------
# STEP 4 & 5: Subtype-Adaptive Multi-Stage FiLM & 3D Architectures
# ------------------------------------------------------------------------------
model:
  num_subtypes: 4
  film_embed_dim: 128
  deep_supervision: true
  resunet_channels: [32, 64, 128, 256, 320]
  swin_feature_size: 48

# ------------------------------------------------------------------------------
# STEP 6: Training & Inference Engine (A100 80GB Configuration)
# ------------------------------------------------------------------------------
training:
  epochs: 120
  warmup_epochs: 5
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 1.0e-5
  amp_dtype: "bfloat16"
  deep_supervision_weights: [1.0, 0.5, 0.25]
  sw_batch_size: 8
  sw_overlap: 0.5

# ------------------------------------------------------------------------------
# STEP 7: Binary Morphological Post-Processing
# ------------------------------------------------------------------------------
postprocessing:
  prob_threshold: 0.5
  min_component_voxels: 50
  secondary_volume_ratio: 0.10
  secondary_max_distance_mm: 30.0
  closing_radius_mm: 2

