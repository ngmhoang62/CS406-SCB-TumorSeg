project:
  seed: 42
  num_workers: 0
paths:
  raw_images_dir: data/raw/images
  raw_expert_seg_dir: data/raw/segmentations/expert
  clinical_excel: data/raw/clinical_and_imaging_info.xlsx
  official_splits_csv: data/raw/train_test_splits.csv
  splits_metadata_csv: data/splits/splits_metadata.csv
  processed_npz_dir: data/processed/full_volume_v1
  outputs_dir: outputs/baseline
preprocessing:
  spacing: [1.0, 1.0, 1.0]
  zscore_eps: 1.0e-8
  output_dtype: float32
  val_ratio: 0.15
model:
  nnunet_features: [32, 64, 128, 256, 320, 320]
  attention_channels: [32, 64, 128, 256, 320]
  swin_feature_size: 48
  swin_use_checkpoint: true
training:
  # Starting values to profile against VRAM and validation, in D,H,W order.
  patch_size: [96, 96, 96]
  batch_size: 2
  # Effective model batch = batch_size * patches_per_case.
  patches_per_case: 1
  positive_patch_probability: 0.5
  cache_rate: 0.0
  epochs: 120
  warmup_epochs: 5
  lr: 0.0003
  weight_decay: 0.00001
  use_amp: true
  sw_batch_size: 1
  sw_overlap: 0.5
inference:
  threshold: 0.5
